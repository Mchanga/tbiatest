services:
  - type: web
    name: tbiatest-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://tbiatest.onrender.com
      - key: CORS_ORIGIN
        value: https://tbiatest.onrender.com
      - key: PUBLIC_API_URL
        value: https://tbiatest-api.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: tbiatest
    runtime: static
    plan: free
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tbiatest-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
